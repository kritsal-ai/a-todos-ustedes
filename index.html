<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a todos ustedes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0d0d;
    color:#d4d4d4;
    font-family:Georgia, serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

/* soft film grain */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:5px 5px;
    opacity:.12;
    pointer-events:none;
}

/* faint vignette */
body::after{
    content:"";
    position:fixed;
    inset:0;
    box-shadow: inset 0 0 180px rgba(0,0,0,.95);
    pointer-events:none;
}

main{
    text-align:center;
    max-width:700px;
    padding:40px;
}

h1{
    font-size:.8rem;
    font-weight:normal;
    letter-spacing:.35em;
    color:#666;
    text-transform:uppercase;
    margin-bottom:80px;
}

p{
    font-size:2rem;
    color:#efefef;
    letter-spacing:.04em;
}
</style>
</head>

<body>

<main>
    <h1>a todos ustedes</h1>

    <p>○○☻☻♥☼♀♦↓◙♦♂♥♠↓☼§☺↕♣☼♫¶◘♣↕○•◘¶►☺¶◘►♫•</p>
</main>

</body>
</html>
